routes:
  # 1. Public Health Check (Gateway)
  - id: health-check
    uri: /health
    methods:
      - GET
    plugins:
      mocking:
        response_status: 200
        content_type: "application/json"
        response_example: '{"status": "ok", "system": "NodusCore DX-OS"}'

  # 2. Public Allowlist: Consumer QR Traceability (No auth required)
  - id: public-trace-api
    uri: /api/trace/*
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,OPTIONS"
      proxy-rewrite:
        regex_uri:
          - "^/api/trace/.*"
          - "/v1/graphql"
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1

  # 3. Protected Data API (Zero-Trust: Keycloak JWT required for 5 internal roles)
  - id: hasura-data-api
    uri: /api/data/*
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
      openid-connect:
        client_id: "nodus-frontend"
        client_secret: "public-client"
        discovery: "http://keycloak:8080/realms/nodus-core/.well-known/openid-configuration"
        bearer_only: true
        use_jwks: true
        realm: "nodus-core"
      proxy-rewrite:
        regex_uri:
          - "^/api/data/?(.*)"
          - "/$1"
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1

  # 4. Protected Workflow API (Zero-Trust: Keycloak JWT required)
  - id: n8n-workflow-api
    uri: /api/workflow/*
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
      openid-connect:
        client_id: "nodus-frontend"
        client_secret: "public-client"
        discovery: "http://keycloak:8080/realms/nodus-core/.well-known/openid-configuration"
        bearer_only: true
        use_jwks: true
        realm: "nodus-core"
      proxy-rewrite:
        regex_uri:
          - "^/api/workflow/?(.*)"
          - "/$1"
    upstream:
      type: roundrobin
      nodes:
        "n8n:5678": 1

#END
