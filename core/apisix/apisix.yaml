routes:
  # 1. Gateway Health Check
  - id: gateway-health-route
    uri: /health
    methods:
      - GET
    plugins:
      mocking:
        response_status: 200
        content_type: "application/json"
        response_example: '{"status": "UP", "gateway": "Apache APISIX", "engine": "NodusCore DX-OS"}'

  # 2. Public Allowlist: Consumer QR Traceability (No Keycloak token required, Rate Limited)
  - id: public-trace-route
    uri: /api/trace/*
    methods:
      - GET
      - POST
      - OPTIONS
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/api/trace/?(.*)"
          - "/v1/graphql"
        headers:
          set:
            x-hasura-role: "public_trace"
          remove:
            - "x-hasura-admin-secret"
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,OPTIONS"
      limit-count:
        count: 60
        time_window: 60
        rejected_code: 429
        key_type: var
        key: remote_addr
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1

  # 3. Direct Hasura GraphQL Route (CORS enabled for Frontend SPA)
  - id: hasura-graphql-route
    uri: /v1/graphql
    methods:
      - POST
      - OPTIONS
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://localhost:3001"
        allow_credential: true
        allow_methods: "POST,OPTIONS"
        allow_headers: "Authorization,Content-Type,x-hasura-role,x-hasura-admin-secret"
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1

  # 4. Keycloak Identity Proxy Route (PKCE OIDC flows)
  - id: keycloak-auth-route
    uri: /auth/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/auth/(.*)"
          - "/$1"
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "*"
    upstream:
      type: roundrobin
      nodes:
        "keycloak:8080": 1

  # 5. Protected Data API (Zero-Trust: Keycloak JWT required for 5 internal roles)
  - id: hasura-data-api
    uri: /api/data/*
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
      openid-connect:
        client_id: "nodus-frontend"
        client_secret: "public-client"
        discovery: "http://keycloak:8080/realms/nodus-core/.well-known/openid-configuration"
        bearer_only: true
        use_jwks: true
        realm: "nodus-core"
      proxy-rewrite:
        regex_uri:
          - "^/api/data/?(.*)"
          - "/$1"
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1

  # 6. Protected Workflow API (Zero-Trust: Keycloak JWT required)
  - id: n8n-workflow-api
    uri: /api/workflow/*
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
      openid-connect:
        client_id: "nodus-frontend"
        client_secret: "public-client"
        discovery: "http://keycloak:8080/realms/nodus-core/.well-known/openid-configuration"
        bearer_only: true
        use_jwks: true
        realm: "nodus-core"
      proxy-rewrite:
        regex_uri:
          - "^/api/workflow/?(.*)"
          - "/$1"
    upstream:
      type: roundrobin
      nodes:
        "n8n:5678": 1

  # 7. Open-Core Sample Plugin: Dynamic QR Generator
  - id: plugin_qr_route
    uri: /api/plugins/qr/*
    upstream:
      nodes:
        "plugin-qr-generator:4001": 1
      type: roundrobin
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/plugins/qr/(.*)", "/$1"]

#END
